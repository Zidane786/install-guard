name: release

# When a merge to main carries a new plugin version (plugins/install-guard/.claude-plugin/plugin.json),
# tag it vX.Y.Z and publish a GitHub Release whose notes are that version's CHANGELOG section.
# Merges that don't change the version publish nothing.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write   # create the tag and the release

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Read the plugin version
        id: version
        run: echo "version=$(python3 scripts/release_notes.py --version)" >> "$GITHUB_OUTPUT"

      - name: Skip if this version is already released
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if gh release view "v$VERSION" >/dev/null 2>&1 || git rev-parse -q --verify "refs/tags/v$VERSION" >/dev/null; then
            echo "v$VERSION already exists; nothing to release."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build the release notes from the CHANGELOG
        if: steps.check.outputs.skip == 'false'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: python3 scripts/release_notes.py "$VERSION" > release-notes.md

      - name: Publish the release
        if: steps.check.outputs.skip == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          gh release create "v$VERSION" \
            --target "$GITHUB_SHA" \
            --title "install-guard $VERSION" \
            --notes-file release-notes.md \
            --latest
